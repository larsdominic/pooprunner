<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kid Running</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #228B22 100%);
    height: 100dvh;
    overflow: hidden;
    font-family: sans-serif;
  }

  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud1 { width: 120px; height: 40px; top: 80px; animation: floatCloud 18s linear infinite; }
  .cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .cloud1::after  { width: 40px; height: 40px; top: -20px; left: 60px; }
  .cloud2 { width: 90px; height: 30px; top: 140px; animation: floatCloud 25s linear infinite; animation-delay: -10s; }
  .cloud2::before { width: 45px; height: 45px; top: -22px; left: 10px; }
  .cloud2::after  { width: 30px; height: 30px; top: -14px; left: 45px; }

  @keyframes floatCloud {
    from { left: -200px; }
    to   { left: 110vw; }
  }

  .sun {
    position: absolute;
    top: 30px; right: 80px;
    width: 60px; height: 60px;
    background: #FFD700;
    border-radius: 50%;
    box-shadow: 0 0 30px #FFD700, 0 0 60px rgba(255,215,0,0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px #FFD700, 0 0 60px rgba(255,215,0,0.4); }
    50%       { box-shadow: 0 0 50px #FFD700, 0 0 90px rgba(255,215,0,0.6); }
  }

  .ground-line {
    position: absolute;
    bottom: var(--ground);
    width: 100%;
    height: 3px;
    background: rgba(0,0,0,0.1);
  }

  /* Kid wrapper — fixed on the right-ish; world scrolls past */
  .kid-wrapper {
    position: absolute;
    bottom: var(--ground);
    left: 32vw;
    animation: bounce 0.12s ease-in-out infinite alternate;
  }
  .kid-wrapper.jumping {
    animation: jumpArc 0.6s ease-out forwards;
  }
  @keyframes bounce {
    from { bottom: var(--ground); }
    to   { bottom: calc(var(--ground) + 6px); }
  }
  @keyframes jumpArc {
    0%   { bottom: var(--ground); }
    40%  { bottom: calc(var(--ground) + 160px); }
    100% { bottom: var(--ground); }
  }
  .kid-wrapper.jumping .leg-left,
  .kid-wrapper.jumping .leg-right { animation: none; transform: rotate(0deg); }
  .kid-wrapper.jumping .arm-left  { animation: none; transform: rotate(-80deg); }
  .kid-wrapper.jumping .arm-right { animation: none; transform: rotate(-80deg); }

  /* ===== Border collie chasing the kid ===== */
  .dog {
    position: absolute;
    bottom: var(--ground);
    left: 8vw;
    width: 90px;
    height: 0;
    transform-origin: bottom left;
    animation: dogBob 0.12s ease-in-out infinite alternate, dogLunge 0.5s ease-in-out infinite;
    z-index: 3;
  }
  @keyframes dogBob {
    from { bottom: var(--ground); }
    to   { bottom: calc(var(--ground) + 10px); }
  }
  .dog.jumping {
    animation: dogJump 0.55s ease-out forwards, dogLunge 0.5s ease-in-out infinite;
  }
  @keyframes dogJump {
    0%   { bottom: var(--ground); }
    45%  { bottom: calc(var(--ground) + 150px); }
    100% { bottom: var(--ground); }
  }
  @keyframes dogLunge {
    0%   { transform: scale(var(--dog-scale, 1.6)) translateX(0)   rotate(0deg); }
    50%  { transform: scale(var(--dog-scale, 1.6)) translateX(14px) rotate(3deg); }
    100% { transform: scale(var(--dog-scale, 1.6)) translateX(0)   rotate(0deg); }
  }
  /* freeze legs mid-jump */
  .dog.jumping .dleg { animation: none; transform: rotate(0deg); }

  /* Game over: dog stops running, trots over to the fallen kid, then licks */
  .dog.comforting {
    animation: none;
    transform: scale(var(--dog-scale, 1.6));
    transition: left 1s ease-in-out;
  }
  .dog.comforting .dleg { animation: dLegA 0.25s ease-in-out infinite alternate; }
  .dog.comforting .dleg-fr,
  .dog.comforting .dleg-bl { animation: dLegB 0.25s ease-in-out infinite alternate; }
  .dog.comforting .tail { animation: dogTail 0.12s ease-in-out infinite alternate; }

  /* once reached the kid: legs stop, only tongue + tail move */
  .dog.licking .dleg { animation: none; transform: rotate(0deg); }

  /* licking tongue */
  .dog .tongue {
    position: absolute;
    bottom: 30px; left: 94px;
    width: 8px; height: 14px;
    background: #ff6b9d;
    border-radius: 4px 4px 6px 6px;
    transform-origin: top center;
    opacity: 0;
  }
  .dog.licking .tongue {
    opacity: 1;
    animation: lick 0.35s ease-in-out infinite alternate;
  }
  @keyframes lick {
    from { transform: rotate(-10deg) scaleY(0.7); }
    to   { transform: rotate(20deg)  scaleY(1.1); }
  }

  /* floating love hearts */
  .love-heart {
    position: fixed;
    font-size: 1.6rem;
    pointer-events: none;
    z-index: 998;
    animation: floatHeart 1.6s ease-out forwards;
  }
  @keyframes floatHeart {
    0%   { transform: translateY(0) scale(0.4);   opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(-90px) scale(1.2); opacity: 0; }
  }
  /* body */
  .dog .body {
    position: absolute;
    bottom: 20px; left: 8px;
    width: 62px; height: 30px;
    background: #2b2b2b;
    border-radius: 16px 20px 12px 12px;
  }
  /* white chest/belly patch */
  .dog .body::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 6px;
    width: 40px; height: 16px;
    background: #f5f5f5;
    border-radius: 12px;
  }
  /* head */
  .dog .head-d {
    position: absolute;
    bottom: 34px; left: 56px;
    width: 30px; height: 26px;
    background: #2b2b2b;
    border-radius: 14px 16px 10px 12px;
  }
  /* white blaze on face */
  .dog .head-d::after {
    content: '';
    position: absolute;
    top: 4px; left: 11px;
    width: 8px; height: 18px;
    background: #f5f5f5;
    border-radius: 6px;
  }
  /* snout */
  .dog .snout {
    position: absolute;
    bottom: 34px; left: 82px;
    width: 14px; height: 12px;
    background: #2b2b2b;
    border-radius: 6px 8px 8px 6px;
  }
  .dog .snout::after {
    content: '';
    position: absolute;
    top: 2px; right: 0;
    width: 5px; height: 5px;
    background: #111;
    border-radius: 50%;
  }
  /* ear */
  .dog .ear {
    position: absolute;
    bottom: 56px; left: 60px;
    width: 12px; height: 14px;
    background: #2b2b2b;
    border-radius: 6px 6px 0 0;
    transform: rotate(-10deg);
  }
  /* tail */
  .dog .tail {
    position: absolute;
    bottom: 30px; left: -6px;
    width: 22px; height: 10px;
    background: #2b2b2b;
    border-radius: 8px;
    transform-origin: right center;
    animation: dogTail 0.08s ease-in-out infinite alternate;
  }
  .dog .tail::after {
    content: '';
    position: absolute;
    left: 0; top: -2px;
    width: 10px; height: 12px;
    background: #f5f5f5;
    border-radius: 6px;
  }
  @keyframes dogTail {
    from { transform: rotate(-30deg); }
    to   { transform: rotate(35deg); }
  }
  /* legs */
  .dog .dleg {
    position: absolute;
    bottom: 0;
    width: 8px; height: 22px;
    background: #2b2b2b;
    border-radius: 4px;
    transform-origin: top center;
  }
  .dog .dleg-fl { left: 60px; animation: dLegA 0.1s ease-in-out infinite alternate; }
  .dog .dleg-fr { left: 50px; animation: dLegB 0.1s ease-in-out infinite alternate; }
  .dog .dleg-bl { left: 20px; animation: dLegB 0.1s ease-in-out infinite alternate; }
  .dog .dleg-br { left: 10px; animation: dLegA 0.1s ease-in-out infinite alternate; }
  @keyframes dLegA { from { transform: rotate(-55deg); } to { transform: rotate(50deg); } }
  @keyframes dLegB { from { transform: rotate(50deg); }  to { transform: rotate(-55deg); } }

  /* .kid is a zero-height anchor at ground level; all parts grow upward via negative bottom */
  .kid {
    width: 80px;
    height: 0;
    position: relative;
  }

  /* Crying overlay on head */
  .cry {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3.5rem;
    line-height: 1;
    display: none;
    animation: cryBounce 0.4s ease-in-out infinite alternate;
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .crying .cry { display: block; }
  .crying .head img { opacity: 0; }
  @keyframes cryBounce {
    from { transform: translateX(-50%) scale(1);    }
    to   { transform: translateX(-50%) scale(1.15); }
  }

  /* Leg containers — rotate around hip (top center); shoe is a child */
  .leg-left, .leg-right {
    position: absolute;
    width: 16px; height: 46px; /* leg shaft 36px + shoe 10px */
    bottom: 0;
    transform-origin: top center;
  }
  .leg-left  { left: 16px; animation: legLeft  0.1s ease-in-out infinite alternate; }
  .leg-right { left: 48px; animation: legRight 0.1s ease-in-out infinite alternate; }
  @keyframes legLeft  { from { transform: rotate(-40deg); } to { transform: rotate(35deg); } }
  @keyframes legRight { from { transform: rotate(35deg); }  to { transform: rotate(-40deg); } }

  /* Leg shaft — upper part of the leg container */
  .leg-left::before, .leg-right::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 16px; height: 36px;
    background: #4169E1;
    border-radius: 8px 8px 4px 4px;
  }

  /* Shoe — anchored at the bottom of the leg container */
  .leg-left::after, .leg-right::after {
    content: '';
    position: absolute;
    bottom: 0; left: -3px;
    width: 22px; height: 10px;
    background: #8B0000;
    border-radius: 4px 6px 4px 2px;
  }

  /* Torso above legs */
  .torso {
    position: absolute;
    bottom: 44px; left: 18px;
    width: 44px; height: 34px;
    background: #FF6B35;
    border-radius: 6px 6px 4px 4px;
  }

  .arm-left, .arm-right {
    position: absolute;
    width: 14px; height: 32px;
    background: #FF6B35;
    border-radius: 7px;
    bottom: 42px;
    transform-origin: top center;
  }
  .arm-left  { left: 8px;  animation: armLeft  0.1s ease-in-out infinite alternate; }
  .arm-right { left: 58px; animation: armRight 0.1s ease-in-out infinite alternate; }
  @keyframes armLeft  { from { transform: rotate(-60deg); } to { transform: rotate(30deg); } }
  @keyframes armRight { from { transform: rotate(30deg); }  to { transform: rotate(-60deg); } }

  .backpack {
    position: absolute;
    bottom: 44px; left: 52px;
    width: 22px; height: 26px;
    background: #9B59B6;
    border-radius: 4px;
    z-index: -1;
  }
  .backpack::after {
    content: '';
    position: absolute;
    top: 4px; left: 3px;
    width: 16px; height: 10px;
    background: #8E44AD;
    border-radius: 2px;
  }

  /* Big transparent head floating above torso */
  .head {
    position: absolute;
    bottom: 68px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    animation: bobble 0.12s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }
  .head img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
  }
  @keyframes bobble {
    from { transform: translateX(-50%) rotate(-8deg) scaleY(1.04); }
    to   { transform: translateX(-50%) rotate(8deg)  scaleY(0.96); }
  }

  /* Poop obstacle — bottom sits on ground line */
  .poop {
    position: absolute;
    bottom: calc(var(--ground) - 4px);
    font-size: 2.8rem;
    line-height: 1;
    right: -80px;
    cursor: default;
    user-select: none;
  }
  @keyframes poopSlide {
    from { right: -80px; }
    to   { right: 110vw; }
  }

  /* Flies around poop */
  .poop::after {
    content: '🪰';
    position: absolute;
    font-size: 1rem;
    top: -14px; left: 50%;
    animation: flyBuzz 0.5s ease-in-out infinite alternate;
  }
  @keyframes flyBuzz {
    from { transform: translateX(-8px) translateY(0); }
    to   { transform: translateX(8px)  translateY(-6px); }
  }

  .dust {
    position: absolute;
    bottom: 40%;
    width: 20px; height: 20px;
    background: rgba(180,160,120,0.5);
    border-radius: 50%;
    animation: dustPuff 0.7s ease-out infinite;
  }
  .dust:nth-child(2) { animation-delay: 0.2s; }
  .dust:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dustPuff {
    0%   { transform: scale(0.3); opacity: 0.8; left: 20vw; }
    100% { transform: scale(2.5); opacity: 0;   left: 15vw; }
  }

  .label {
    position: absolute;
    bottom: calc(var(--ground) * 0.5);
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    white-space: nowrap;
    animation: wobble 1s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes wobble {
    0%, 100% { transform: translateX(-50%) rotate(-2deg); }
    50%       { transform: translateX(-50%) rotate(2deg); }
  }

  .score {
    position: absolute;
    top: 16px; left: 16px;
    font-size: 1.4rem;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
  }
  @keyframes scorePop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.6); }
    100% { transform: scale(1); }
  }
  .score.pop { animation: scorePop 0.25s ease-out; }

  .hint {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 1rem;
    color: rgba(255,255,255,0.8);
    text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    letter-spacing: 0.1em;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ===== Mobile / narrow screens ===== */
  @media (max-width: 600px) {
    /* smaller dog, tucked to the far left so it doesn't overlap the kid */
    .dog {
      --dog-scale: 0.9;
      left: 4vw;
    }
    /* shrink the kid and keep it anchored on the ground */
    .kid-wrapper {
      left: 42vw;
      transform: scale(0.7);
      transform-origin: bottom center;
    }
    /* the jump/bounce animations set `bottom`; scale must persist during them */
    .kid-wrapper, .kid-wrapper.jumping {
      transform: scale(0.7);
    }
    /* smaller poop */
    .poop { font-size: 2rem; }
    /* smaller title + score */
    .label { font-size: 1.5rem; }
    .score { font-size: 1.1rem; }
    /* keep hint on one line on narrow screens */
    .hint { font-size: 0.9rem; letter-spacing: 0.03em; }
  }
</style>
</head>
<body>

  <div class="label">James Poop Runner</div>
  <div class="hint">SPACE or TAP to jump</div>
  <div class="score">💩 0</div>
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="ground-line"></div>
  <div class="dust"></div>
  <div class="dust"></div>
  <div class="dust"></div>

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'splat') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      }
    } catch (e) { /* audio not available — ignore */ }
  }

  /* ---- Randomized poop launch: fresh element each crossing ---- */
  const activePoops = [];   // { el, id, cleared, scored }

  function launchPoop() {
    if (dead) return;
    // Decide how many poops in this wave: mix of singles and clusters
    const r = Math.random();
    // mobile: always single poops (clusters too hard to clear on small screen)
    const count = isMobile
      ? 1
      : (r < 0.45 ? 1 : (r < 0.8 ? 2 : 3));
    // one speed for the whole wave so cluster poops stay tightly packed (jumpable in one arc)
    // mobile: slower (easier to time the jump)
    const dur = isMobile
      ? 2.8 + Math.random() * 2.0   // 2.8s–4.8s
      : 1.6 + Math.random() * 2.6;  // 1.6s–4.2s
    let maxTotal = 0;
    for (let i = 0; i < count; i++) {
      // tiny stagger keeps them touching — one jump clears the whole clump
      const delay = i * 0.18;
      maxTotal = Math.max(maxTotal, dur + delay);
      spawnOne(dur, delay);
    }
    // next wave after this one clears + a random gap (always land-able)
    // mobile: bigger breathing room between waves
    const extra = isMobile ? (1400 + Math.random() * 2000) : (700 + Math.random() * 1500);
    const gap = (maxTotal * 1000) + extra;
    spawnTimer = setTimeout(launchPoop, gap);
  }

  function spawnOne(dur, delay) {
    poopId++;
    const el = document.createElement('div');
    el.className = 'poop';
    el.textContent = '💩';
    el.style.animation = `poopSlide ${dur}s ${delay}s linear forwards`;
    document.body.appendChild(el);
    const rec = { el, id: poopId, scored: false, dogTriggered: false };
    activePoops.push(rec);
    el.addEventListener('animationend', () => {
      el.remove();
      const i = activePoops.indexOf(rec);
      if (i !== -1) activePoops.splice(i, 1);
    }, { once: true });
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      triggerJump();
    }
  });

  document.addEventListener('touchstart', (e) => {
    e.preventDefault();
    triggerJump();
  }, { passive: false });

  function triggerJump() {
    if (dead) return restart();
    if (jumping) return;
    jumping = true;
    sfx('jump');
    wrapper.classList.add('jumping');
    wrapper.addEventListener('animationend', (ev) => {
      if (ev.animationName === 'jumpArc') {
        wrapper.classList.remove('jumping');
        jumping = false;
      }
    }, { once: true });
  }

  function getRect(el) {
    return el.getBoundingClientRect();
  }

  function dogJump() {
    if (dogJumping || dead) return;
    dogJumping = true;
    dog.classList.add('jumping');
    dog.addEventListener('animationend', (ev) => {
      if (ev.animationName === 'dogJump') {
        dog.classList.remove('jumping');
        dogJumping = false;
      }
    }, { once: true });
  }

  function checkCollision() {
    if (dead) return;
    const kidRect = getRect(wrapper);
    const kidBody = getRect(wrapper.querySelector('.kid'));
    // hitbox scales with the rendered kid (mobile shrinks it via CSS transform)
    const scale = (kidBody.width || 80) / 80;   // 80px = kid's base width
    const kidHit = {
      left:   kidRect.left + 15 * scale,
      right:  kidRect.left + 65 * scale,
      top:    kidRect.top  - 120 * scale,
      bottom: kidRect.top
    };
    const dogRect = getRect(dog);
    const dogCenter = (dogRect.left + dogRect.right) / 2;
    for (const rec of activePoops) {
      const pr = getRect(rec.el);
      const tightOverlap = kidHit.left < pr.right && kidHit.right > pr.left;

      // ground collision only when not jumping
      if (!jumping) {
        const hit = tightOverlap &&
                    kidHit.top < pr.bottom &&
                    kidHit.bottom > pr.top;
        if (hit) { gameOver(); return; }
      }

      // dog auto-jumps when a poop approaches it — once per poop
      const pCenter = (pr.left + pr.right) / 2;
      if (!rec.dogTriggered && !dogJumping && pCenter > dogCenter - 70 && pCenter < dogCenter + 40) {
        rec.dogTriggered = true;
        dogJump();
      }

      // poop fully passed the kid → +1 (each poop counted once)
      if (!rec.scored && pr.right < kidHit.left) {
        rec.scored = true;
        score++;
        scoreEl.textContent = '💩 ' + score;
        scoreEl.classList.remove('pop');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('pop');
      }
    }
  }

  function spawnSplatter(originX, originY) {
    const count = 28;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.textContent = '💩';
      const angle = (i / count) * 360;
      const dist  = 80 + Math.random() * 280;
      const size  = 1 + Math.random() * 3.5;
      const dur   = 0.4 + Math.random() * 0.5;
      const dx    = Math.cos(angle * Math.PI / 180) * dist;
      const dy    = Math.sin(angle * Math.PI / 180) * dist;
      Object.assign(el.style, {
        position:   'fixed',
        left:       originX + 'px',
        top:        originY + 'px',
        fontSize:   '1rem',
        lineHeight: '1',
        pointerEvents: 'none',
        zIndex:     '999',
        transform:  'translate(-50%,-50%) scale(0.1)',
        opacity:    '1',
        transition: `transform ${dur}s ease-out, opacity ${dur}s ease-out, left ${dur}s ease-out, top ${dur}s ease-out`,
      });
      document.body.appendChild(el);
      // Trigger animation next frame
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.left    = (originX + dx) + 'px';
        el.style.top     = (originY + dy) + 'px';
        el.style.transform = `translate(-50%,-50%) scale(${size})`;
        el.style.opacity = '0';
      }));
      setTimeout(() => el.remove(), (dur + 0.1) * 1000);
    }
  }

  function gameOver() {
    dead = true;
    sfx('splat');
    cancelAnimationFrame(collisionLoop);
    clearTimeout(spawnTimer);

    // Find collision point (centre of kid body)
    const kr = getRect(wrapper);
    const kidBodyRect = getRect(wrapper.querySelector('.kid'));
    const cx = (kr.left + kr.right) / 2;
    const cy = kr.top - 60;  // roughly mid-body

    // Freeze kid
    const cs = getComputedStyle(wrapper);
    wrapper.style.left = cs.left;
    wrapper.style.bottom = cs.bottom;
    wrapper.style.animation = 'none';
    // Freeze all active poops in place
    activePoops.forEach(rec => {
      const ps = getComputedStyle(rec.el);
      rec.el.style.right = ps.right;
      rec.el.style.animation = 'none';
    });
    // Splat the kid
    wrapper.style.transform = 'rotate(90deg) translateX(-40px)';
    wrapper.style.transition = 'transform 0.3s ease-in';
    wrapper.querySelector('.kid').classList.add('crying');

    // Poop splatter burst
    spawnSplatter(cx, cy);

    // Show game over
    label.textContent = '💩 SPLAT! Score: ' + score + ' 💩';
    label.style.fontSize = '2.5rem';
    label.style.animation = 'none';

    // Restart hint
    document.querySelector('.hint').textContent = 'Tap or SPACE to try again';

    // Dog trots over to comfort the fallen kid, then licks its face with love hearts
    dog.classList.remove('jumping');
    dogJumping = false;
    dog.classList.add('comforting');
    // position the dog so its snout reaches the kid; measure real widths (mobile-safe)
    const dogW = getRect(dog).width || 144;
    const kidCenter = (kidBodyRect.left + kidBodyRect.right) / 2;
    const targetLeft = kidCenter - dogW * 0.75;   // snout ends up at the kid's face
    dog.style.left = targetLeft + 'px';
    setTimeout(() => {
      if (!dead) return;               // player may have restarted
      dog.classList.add('licking');
      spawnHearts();
      heartTimer = setInterval(() => { if (dead) spawnHearts(); }, 900);
    }, 1050);
  }

  let heartTimer;
  function spawnHearts() {
    const dr = getRect(dog);
    for (let i = 0; i < 3; i++) {
      const h = document.createElement('div');
      h.className = 'love-heart';
      h.textContent = ['❤️','💛','💕'][i % 3];
      h.style.left = (dr.right - 10 + (i - 1) * 18) + 'px';
      h.style.top  = (dr.top + 6) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1700);
    }
  }

  function restart() {
    dead = false;
    score = 0;
    poopId = 0;
    dogJumping = false;
    dog.classList.remove('jumping', 'comforting', 'licking');
    dog.style.left = '';        // back to CSS default (8vw)
    dog.style.transition = '';
    clearInterval(heartTimer);
    document.querySelectorAll('.love-heart').forEach(h => h.remove());
    scoreEl.textContent = '💩 0';
    scoreEl.classList.remove('pop');
    wrapper.querySelector('.kid').classList.remove('crying');
    wrapper.style = '';
    // remove any leftover poop elements
    activePoops.forEach(rec => rec.el.remove());
    activePoops.length = 0;
    label.textContent = 'James Poop Runner';
    label.style.fontSize = '';
    label.style.animation = '';
    document.querySelector('.hint').textContent = 'SPACE or TAP to jump';
    loop();
    clearTimeout(spawnTimer);
    spawnTimer = setTimeout(launchPoop, 800);
  }

  function loop() {
    if (dead) return;
    checkCollision();
    collisionLoop = requestAnimationFrame(loop);
  }
  loop();
  spawnTimer = setTimeout(launchPoop, 800);
</script>
</body>
</html>
