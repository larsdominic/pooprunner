<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poop Runner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2387CEEB'/%3E%3Crect y='68' width='100' height='32' fill='%232E7D32'/%3E%3Ctext x='50' y='58' font-size='60' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%92%A9%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100dvh;
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 62%, #90EE90 62%, #228B22 100%);
    font-family: sans-serif;
    color: #3b2a14;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  .sun {
    position: fixed; top: 40px; right: 12%; width: 70px; height: 70px;
    background: #FFD700; border-radius: 50%;
    box-shadow: 0 0 40px #FFD700, 0 0 80px rgba(255, 215, 0, .4);
    animation: pulse 2s ease-in-out infinite;
  }
  @media (max-width: 600px) { .sun { top: 16px; right: 6%; width: 48px; height: 48px; } }
  @keyframes pulse { 50% { box-shadow: 0 0 60px #FFD700, 0 0 110px rgba(255, 215, 0, .6); } }

  .cloud { position: fixed; background: #fff; border-radius: 50px; opacity: .9; z-index: -1; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud1 { width: 120px; height: 40px; top: 44px; animation: drift 22s linear infinite; }
  .cloud1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
  .cloud1::after { width: 40px; height: 40px; top: -20px; left: 60px; }
  .cloud2 { width: 90px; height: 30px; top: 26px; animation: drift 30s linear infinite; animation-delay: -14s; }
  .cloud2::before { width: 45px; height: 45px; top: -22px; left: 10px; }
  .cloud2::after { width: 30px; height: 30px; top: -14px; left: 45px; }
  @keyframes drift { from { left: -200px; } to { left: 110%; } }

  h1 {
    margin-top: 40px; font-size: clamp(2.2rem, 8vw, 4rem); color: #fff; text-align: center; line-height: 1.05;
    text-shadow: 3px 3px 0 rgba(0, 0, 0, .25);
    animation: wobble 1.2s ease-in-out infinite;
  }
  @keyframes wobble { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .sub { margin: 10px 0 28px; color: #fff; font-weight: bold; font-size: 1.1rem; text-shadow: 1px 1px 3px rgba(0, 0, 0, .35); text-align: center; }

  .games { display: grid; grid-template-columns: repeat(2, minmax(0, 300px)); gap: 20px; width: 100%; justify-content: center; }
  @media (max-width: 600px) { .games { grid-template-columns: minmax(0, 360px); } }

  .game {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: #fffaf0; border: 4px solid #fff; border-radius: 24px;
    padding: 22px 18px 20px; text-decoration: none; color: inherit;
    box-shadow: 0 8px 0 rgba(0, 0, 0, .15), 0 14px 30px rgba(0, 0, 0, .15);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .game:hover, .game:focus-visible { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 12px 0 rgba(0, 0, 0, .15), 0 20px 36px rgba(0, 0, 0, .2); outline: none; }
  .game:active { transform: translateY(2px); box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }

  .art { font-size: 4rem; line-height: 1; height: 4.4rem; display: flex; align-items: flex-end; gap: 4px; }
  .art .bob { display: inline-block; animation: bob .5s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-10px); } }
  .game h2 { margin-top: 12px; font-size: 1.6rem; color: #6b3f17; }
  .game p { margin-top: 6px; font-size: 1rem; line-height: 1.35; color: #5a4630; }
  .play {
    margin-top: 16px; display: inline-block; padding: 12px 30px; border-radius: 999px;
    background: #FF6B35; color: #fff; font-weight: 800; font-size: 1.15rem; letter-spacing: .03em;
    box-shadow: 0 4px 0 #c94a1c;
  }
  .game.three .play { background: #2E7D32; box-shadow: 0 4px 0 #1b5e20; }

  /* Phones sideways are short: both games side by side, no scrolling */
  @media (orientation: landscape) and (max-height: 500px) {
    body { padding: 10px 16px 14px; justify-content: center; }
    h1 { margin-top: 0; font-size: 2.2rem; }
    .sub { margin: 4px 0 12px; font-size: 1rem; }
    .games { grid-template-columns: repeat(2, minmax(0, 300px)); gap: 16px; }
    .game { padding: 12px 14px 14px; border-radius: 20px; }
    .art { font-size: 2.6rem; height: 2.9rem; }
    .game h2 { margin-top: 6px; font-size: 1.3rem; }
    .game p { margin-top: 4px; font-size: .9rem; }
    .play { margin-top: 10px; padding: 9px 24px; font-size: 1rem; }
    .sun { top: 12px; right: 5%; width: 44px; height: 44px; }
    .cloud1 { top: 22px; }
    .cloud2 { top: 12px; }
  }

  /* The games are sideways only: on phones and tablets held upright, ask to turn first */
  .rotate-notice {
    display: none; position: fixed; inset: 0; z-index: 10;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px; text-align: center;
    background: linear-gradient(180deg, #87CEEB 0%, #228B22 100%);
    color: #fff; font-size: 1.4rem; font-weight: bold; line-height: 1.4;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, .3);
  }
  .rotate-notice p { max-width: 320px; }
  .rot-emoji { font-size: 4rem; animation: rot-hint 1.5s ease-in-out infinite; }
  @keyframes rot-hint { 50% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) {
    .rotate-notice { display: flex; }
  }
</style>
</head>
<body>
  <div class="rotate-notice">
    <div class="rot-emoji">📱</div>
    <p>Turn your phone sideways to play Poop Runner!</p>
  </div>

  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <h1>Poop Runner</h1>
  <p class="sub">Pick a game!</p>

  <main class="games">
    <a class="game" href="2d/">
      <div class="art"><span class="bob">🏃</span><span>💩</span></div>
      <h2>Poop Runner</h2>
      <p>The original. Jump the poops before they splat you!</p>
      <span class="play">Play</span>
    </a>
    <a class="game three" href="https://larsdominic.github.io/pooprunner-3d/">
      <div class="art"><span>🧻</span><span class="bob">🐕</span><span>💩</span></div>
      <h2>Poop Runner 3D</h2>
      <p>Clean up the dog park with a toilet-paper blaster, then beat King Poop.</p>
      <span class="play">Play 3D</span>
    </a>
  </main>
</body>
</html>
